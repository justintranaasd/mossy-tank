name: Daily publish

on:
  schedule:
    # Runs at 9am Melbourne time (AEST = UTC+10, so 23:00 UTC previous day)
    - cron: '0 23 * * *'
  workflow_dispatch: # allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        run: curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_Xfq8e21Ucm98u1IGseNBWWQYgyA6/HY40tMhLXC"
